<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Марбрик — официальный сайт</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      /* Тёмно-фиолетовый "замыленный" фон: несколько мягких пятен */
      background:
        radial-gradient(circle at 20% 20%, #4a1d6e 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #6b2fa0 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, #3b1054 0%, transparent 50%),
        linear-gradient(160deg, #1c0526 0%, #2e0a45 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #f0e6ff;
    }

    /* Заголовок в самом верху */
    .site-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(180, 100, 255, 0.6);
      margin-bottom: 30px;
    }

    /* Панель-прямоугольник поверх фона */
    .panel {
      width: 100%;
      max-width: 640px;
      background: rgba(30, 8, 48, 0.75);
      border: 1px solid rgba(190, 120, 255, 0.35);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px); /* лёгкое размытие фона за панелью */
      padding: 32px 28px;
    }

    .panel-heading {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 24px;
      color: #e6ccff;
    }

    /* Сетка плиток 2х2 */
    .tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 12px;
      background: linear-gradient(145deg, rgba(106, 47, 160, 0.5), rgba(60, 18, 92, 0.6));
      border: 1px solid rgba(190, 120, 255, 0.3);
      border-radius: 14px;
      text-decoration: none;
      color: #f0e6ff;
      font-size: 1.1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .tile .icon {
      font-size: 2.2rem;
    }

    .tile:hover {
      transform: translateY(-4px);
      background: linear-gradient(145deg, rgba(140, 70, 200, 0.6), rgba(80, 25, 120, 0.7));
      box-shadow: 0 6px 20px rgba(160, 80, 255, 0.35);
    }

    /* Блоки контактов и соцсетей */
    .info-section {
      margin-top: 28px; /* небольшой отступ снизу от плиток */
      text-align: center;
    }

    .info-section h3 {
      font-size: 1.05rem;
      color: #d9b8ff;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .info-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .info-links a {
      color: #f0e6ff;
      text-decoration: none;
      background: rgba(140, 70, 200, 0.25);
      border: 1px solid rgba(190, 120, 255, 0.25);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .info-links a:hover {
      background: rgba(170, 100, 235, 0.45);
      box-shadow: 0 0 12px rgba(180, 100, 255, 0.4);
    }

    /* Адаптив для телефонов */
    @media (max-width: 480px) {
      .site-title { font-size: 1.5rem; }
      .panel { padding: 24px 16px; }
      .tile { padding: 22px 10px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <h1 class="site-title">Марбрик — официальный сайт</h1>

  <div class="panel">
    <h2 class="panel-heading">Что желаете найти?~</h2>

    <div class="tiles">
      <a class="tile" href="#javatale">
        <span class="icon">❤️</span>
        <span>JavaTale</span>
      </a>
      <a class="tile" href="#fonoteka">
        <span class="icon">💿</span>
        <span>Фонотека</span>
      </a>
      <a class="tile" href="#video">
        <span class="icon">🎥</span>
        <span>Видео</span>
      </a>
      <a class="tile" href="articles.html">
        <span class="icon">📚</span>
        <span>Статьи</span>
      </a>
    </div>

    <div class="info-section">
      <h3>Контактная информация</h3>
      <div class="info-links">
        <a href="mailto:твоя-почта@example.com">Почта</a>
        <a href="https://t.me/твой-ник" target="_blank" rel="noopener">Телеграм</a>
      </div>
    </div>

    <div class="info-section">
      <h3>Социальные сети</h3>
      <div class="info-links">
        <a href="https://youtube.com/@твой-канал" target="_blank" rel="noopener">Ютуб</a>
        <a href="https://vk.com/твоя-страница" target="_blank" rel="noopener">ВК</a>
        <a href="https://dzen.ru/твой-канал" target="_blank" rel="noopener">Дзен</a>
        <a href="https://rutube.ru/channel/твой-канал" target="_blank" rel="noopener">Рутуб</a>
      </div>
    </div>
  </div>

</body>
</html>
